[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kintsugi-studio"
version = "1.0.0"
description = "Kintsugi Studio 2001: procedural vessel fracture engine with a Windows XP themed web GUI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "manifold3d>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
kintsugi-studio = "web_app:studio"

[tool.setuptools]
py-modules = [
    "web_app",
    "kintsugi",
    "mesh_formats",
    "sample_models",
    "generate_sample",
]
